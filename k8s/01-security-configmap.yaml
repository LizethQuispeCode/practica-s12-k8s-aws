apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: practica-s12
data:
  DB_HOST: "db-service"
  DB_PORT: "6379"
  APP_PORT: "8080"
  APP_ENV: "produccion"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-code
  namespace: practica-s12
data:
  app.py: |
    import os
    import sys
    import socket
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    REQUERIDAS = ["DB_HOST", "DB_PORT", "DB_PASSWORD", "APP_PORT"]
    faltan = [v for v in REQUERIDAS if not os.environ.get(v)]
    if faltan:
        print("ERROR: faltan variables de entorno: " + ", ".join(faltan), flush=True)
        sys.exit(1)

    DB_HOST = os.environ["DB_HOST"]
    DB_PORT = int(os.environ["DB_PORT"])
    DB_PASSWORD = os.environ["DB_PASSWORD"]
    APP_PORT = int(os.environ["APP_PORT"])


    def consultar_db():
        try:
            with socket.create_connection((DB_HOST, DB_PORT), timeout=2) as s:
                auth = "*2\r\n$4\r\nAUTH\r\n$%d\r\n%s\r\n" % (len(DB_PASSWORD), DB_PASSWORD)
                s.sendall(auth.encode())
                r = s.recv(64).decode().strip()
                if not r.startswith("+OK"):
                    return False, "AUTH rechazado: " + r
                s.sendall(b"*1\r\n$4\r\nPING\r\n")
                r = s.recv(64).decode().strip()
                return r == "+PONG", r
        except Exception as e:
            return False, "sin conexion a %s:%s -> %s" % (DB_HOST, DB_PORT, e)


    class Handler(BaseHTTPRequestHandler):
        def responder(self, codigo, cuerpo):
            datos = json.dumps(cuerpo, ensure_ascii=False).encode()
            self.send_response(codigo)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(datos)))
            self.end_headers()
            self.wfile.write(datos)

        def do_GET(self):
            if self.path == "/health":
                self.responder(200, {"estado": "vivo"})
            elif self.path == "/ready":
                ok, det = consultar_db()
                self.responder(200 if ok else 503, {"db": det})
            elif self.path == "/":
                ok, det = consultar_db()
                self.responder(200, {"app": "practica-s12", "uid": os.getuid(),
                                     "pod": socket.gethostname(), "db_ok": ok, "db_detalle": det})
            else:
                self.responder(404, {"error": "no encontrado"})

        def log_message(self, fmt, *args):
            print("%s %s" % (self.address_string(), fmt % args), flush=True)


    print("App escuchando en el puerto %d, DB en %s:%d" % (APP_PORT, DB_HOST, DB_PORT), flush=True)
    HTTPServer(("0.0.0.0", APP_PORT), Handler).serve_forever()
